name: Validate NexaCred
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm -r --filter '!@nexacred/web' build
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: pip install -r workers/importer/requirements.txt
      - run: PYTHONPATH=workers/importer pytest workers/importer/tests -q
      - run: python scripts/create_fixture.py
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            playwright-report
            test-results
            compose.log
      - if: always()
        run: docker compose down
